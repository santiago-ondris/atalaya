name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchman:
    name: Watchman / Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/watchman
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/watchman/go.mod
          cache-dependency-path: apps/watchman/go.sum
      - run: go test ./...
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  interpreter:
    name: Interpreter / Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/interpreter
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.12.2
          enable-cache: true
          cache-dependency-glob: apps/interpreter/uv.lock
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  command-center:
    name: Command Center / React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/command-center
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run build

  containers:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [watchman, interpreter, command-center]
    steps:
      - uses: actions/checkout@v6
      - run: docker compose build
