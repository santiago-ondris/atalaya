name: atalaya

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: atalaya
      POSTGRES_USER: atalaya
      POSTGRES_PASSWORD: atalaya_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atalaya -d atalaya"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./apps/watchman
    command:
      - goose
      - -dir
      - /app/migrations
      - postgres
      - postgres://atalaya:atalaya_local@postgres:5432/atalaya?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  watchman:
    build:
      context: ./apps/watchman
    environment:
      ATALAYA_ENV: development
      HTTP_ADDRESS: :8080
      DATABASE_URL: postgres://atalaya:atalaya_local@postgres:5432/atalaya?sslmode=disable
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-120}
      SENTRY_BASE_URL: ${SENTRY_BASE_URL:-https://sentry.io}
      SENTRY_ORG_SLUG: ${SENTRY_ORG_SLUG:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      SENTRY_CATALOG_PATH: /app/config/sentry-integrations.json
      INTERPRETER_URL: http://interpreter:8000
      INTERPRETER_TIMEOUT_SECONDS: ${INTERPRETER_TIMEOUT_SECONDS:-30}
      INTERPRETER_JOB_POLL_SECONDS: ${INTERPRETER_JOB_POLL_SECONDS:-2}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_TIMEOUT_SECONDS: ${TELEGRAM_TIMEOUT_SECONDS:-10}
      TELEGRAM_JOB_POLL_SECONDS: ${TELEGRAM_JOB_POLL_SECONDS:-2}
      TELEGRAM_DEDUP_WINDOW_SECONDS: ${TELEGRAM_DEDUP_WINDOW_SECONDS:-900}
      TELEGRAM_RATE_LIMIT_WINDOW_SECONDS: ${TELEGRAM_RATE_LIMIT_WINDOW_SECONDS:-600}
      TELEGRAM_RATE_LIMIT_PER_APP: ${TELEGRAM_RATE_LIMIT_PER_APP:-10}
      TELEGRAM_INTERPRETER_ALERT_COOLDOWN_SECONDS: ${TELEGRAM_INTERPRETER_ALERT_COOLDOWN_SECONDS:-1800}
      ATALAYA_PUBLIC_URL: ${ATALAYA_PUBLIC_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      interpreter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  interpreter:
    build:
      context: ./apps/interpreter
    environment:
      ATALAYA_ENVIRONMENT: development
      ATALAYA_OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ATALAYA_OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      ATALAYA_OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-20}
      ATALAYA_OPENROUTER_MAX_RETRIES: ${OPENROUTER_MAX_RETRIES:-2}
      ATALAYA_OPENROUTER_MAX_OUTPUT_TOKENS: ${OPENROUTER_MAX_OUTPUT_TOKENS:-900}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  command-center:
    build:
      context: ./apps/command-center
    ports:
      - "5173:80"
    depends_on:
      watchman:
        condition: service_healthy
      interpreter:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
